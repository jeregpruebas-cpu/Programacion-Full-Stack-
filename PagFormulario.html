     <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
            margin: 0;
        }

        span {
            display: block;
            text-align: center;
        }

        /* Header */
        header {
            text-align: center;
            padding: 30px;
            border-bottom: 2px solid black;
        }

        /* Títulos */
        h1,
        h2,
        h3 {
            text-align: center;
        }

        /* Lista */
        ul {
            max-width: 400px;
            margin: auto;
        }

        /* Botones */
        button {

            background-color: white;
            color: black;
            border: 2px solid black;
            padding: 5px 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: black;
            color: white;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            border-top: 2px solid black;
            margin-top: 40px;
        }
         </style>
</head>
