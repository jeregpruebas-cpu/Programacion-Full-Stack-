<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
     <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
            margin: 0;
        }

        span {
            display: block;
            text-align: center;
        }

        /* Header */
        header {
            text-align: center;
            padding: 30px;
            border-bottom: 2px solid black;
        }

        /* Títulos */
        h1,
        h2,
        h3 {
            text-align: center;
        }

        /* Lista */
        ul {
            max-width: 400px;
            margin: auto;
        }

        /* Botones */
        button {

            background-color: white;
            color: black;
            border: 2px solid black;
            padding: 5px 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: black;
            color: white;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            border-top: 2px solid black;
            margin-top: 40px;
        }
        label {
  display: block;            /* hace que quede arriba */
  margin-bottom: 5px;
  padding: 15px;
}

input, select, textarea {
  width: 20%;               /* ocupa todo el ancho */
  padding: 8px;
  border-radius: 5px;
  border: 1px solid #aaa;
}
         </style>
</head>
<body>
        <a href="PagConsulta.html"><button style=" position: absolute; top: 20px;left: 20px;">Volver</button></a>
    <br>
        <h1>Formulario</h1>
        <hr color="black">
    <br>
 <span>Bienvenido a la pagina del formulario de consultas.</span>
 <br>
 <span>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Fusce.</span>
<br>
<form action="#" method="post" style="text-align: center;" >
<label for="nombre">Nombre:</label>
<input type="text" id="nombre" required  placeholder="Ej: Juan">


<label for="apellido">Apellido:</label>
<input type="text" id="apellido" required  placeholder="Ej: Alvarez">

<label for="email">Email:</label>
<input type="text" id="email" required  placeholder="Ej: Maria@gmail.com">

<label for="categoria">Categoria:</label>
 <select id="categoria" name="categoria" required>
     <option value="">Seleccione una opción</option>
    <option value="catalogo">Catálogo</option>
    <option value="respuesta">Respuesta</option>
    <option value="desperfectos">Desperfectos</option>
      </select>

      <label for="descripcion">Descripción:</label>  <textarea 
    id="descripcion" 
    name="descripcion" 
    required 
    placeholder="Describe tu problema..."
    rows="5"
  ></textarea>


</form>
<button type="enviar">Enviar consulta</button>

<hr color="black">
</body>
</html>
