<!DOCTYPE html>
<html lang="es">

<head>

    <title>Envianos tu CV</title>

</head>

<body>
    <a href="PagTrabajo.html"><button>Volver</button></a>
    <br>
    <h1>Formulario de trabajo</h1>
    <p>Campos obligatorios con (<span style="color: red;">*</span>)</p>
    <div>
        <form action="envio.html" method="get">
            <label for="email"><span style="color: red;">*</span>Correo:</label><br>
            <input name="email" placeholder="Ej: Jose@correo.com" maxlength="40" required></input><br><br>
    </div>
    <div>
        <label for="descripcion"><span style="color: red;">*</span>Descripción:</label><br>
        <textarea placeholder="Dejanos saber un poco mas sobre vos..." name="descripcion" maxlength="300"
            required></textarea><br>
        <br>
    </div>
    <div>
        <label><span style="color: red;">*</span>Envianos tu CV (.pdf):</label><br>
        <input type="file" accept=".pdf" required></input><br><br>
        <input type="checkbox" name="contactarse">Acepto ser contactado por la empresa</input><br>

        <br>
        <input type="submit" value="Submit"></input><br>

        <br>
    </div>



    </form>
</body>

</html>
