<!DOCTYPE html>
<html lang="es">

<head>

    <title>Envianos tu CV</title>
 <link rel="stylesheet" href="../css/pagFormularioCV.css">
</head>

<body>

    <a href="pagTrabajo.html"><button style="margin: 15px 15px;">Cancelar</button></a>
    <br>
    <h1>Solicitud de trabajo</h1>
    <p align="center">Campos obligatorios con (<span style="color: red;">*</span>)</p>
    <div align="center">
        <form action="pagEnvio.html" method="get">
            <label for="email"><span style="color: red;">*</span> Correo:</label><br>
            <input type="email" "name="email" placeholder="Ej: Jose@correo.com" maxlength="40" required></input><br><br>

            <label for="descripcion"><span style="color: red;">*</span> Descripción:</label><br>
            <textarea style="width: 30%; height: 150px; padding: 8px; border-radius: 5px; border: 1px solid #aaa;"
                placeholder="Dejanos saber un poco mas sobre vos..." name="descripcion" maxlength="300"
                required></textarea><br>
            <br>

            <label><span style="color: red;">*</span> Envianos tu CV (.pdf):</label><br>
            <input type="file" accept=".pdf" required></input><br><br>
            <input style="width: 20px;" type="checkbox" name="contactarse" required>Acepto ser contactado por la
            empresa</input><br>

            <br>
            <button type="submit" value="Submit">Enviar</button><br>

            <br>
    </div>
    </form>
</body>

</html>
