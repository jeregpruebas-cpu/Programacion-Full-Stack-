<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/pagAdmin.css">
</head>

<body id="top">

    <nav class="navbar">

        <section class="nav-container">

            <span class="nav-logo">
                <a href="index.html">Todo en Blanco</a>
            </span>

            <input type="checkbox" id="menu-toggle">

            <label for="menu-toggle" class="menu-icon">
                ☰
            </label>

            <ul class="nav-menu">
                <li><a href="pagContactanos.html">Contactanos</a></li>
                <li><a href="pagTrabajo.html">Trabaja con nosotros</a></li>
                <li><a href="pagEmpresa.html">Sobre nosotros</a></li>
                <li><a href="pagInicioSesion.html">Iniciar sesión</a></li>
            </ul>

        </section>

    </nav>

    <header>
        <h1>Panel de Administración</h1>
    </header>

    <main>

        <section class="admin-panel">

            <header>
                <h2>Gestión de empleados</h2>
            </header>

            <article class="operaciones">

                <button class="btn" id="btnAltaUsuario">
                    Añadir empleado
                </button>

                <a href="pagInicioSesion.html" class="btn">
                    Cerrar sesión
                </a>

            </article>

            <article class="formularioAltaUsuario">

                <h3>Nuevo empleado</h3>

                <form id="formAltaUsuario">

                    <article class="campo">

                        <label for="nombreEmpleado">
                            Nombre:
                        </label>
                        <input type="text" id="nombreEmpleado" name="nombreEmpleado" required maxlength="30">
                    </article>
                    <article class="campo">

                        <label for="apellidoEmpleado">
                            Apellido:
                        </label>
                        <input type="text" id="apellidoEmpleado" name="apellidoEmpleado" required maxlength="30">
                    </article>

                    <article class="campo">

                        <label for="cedulaEmpleado">
                            Cedula:
                        </label>
                        <input type="text" id="cedulaEmpleado" name="cedulaEmpleado" pattern="[1-9]{1}[0-9]{6}" required
                            maxlength="8">
                    </article>
                    <article class="campo">

                        <label for="cargoEmpleado">
                            Cargo:
                        </label>
                        <input type="text" id="cargoEmpleado" name="cargoEmpleado" required maxlength="30">
                    </article>

                    <article class="operaciones">
                        <button type="submit" class="btn">

                            Guardar

                        </button>

                        <button type="button" id="btnCerrarAltaUsuario" class="btn">

                            Cancelar
                        </button>
                    </article>

                </form>

            </article>

            <article>

                <table>

                    <thead>

                        <tr>
                            <th>Cédula</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Cargo</th>
                        </tr>

                    </thead>

                    <tbody id="tablaEmpleados">

                    </tbody>

                </table>
            </article>

        </section>

    </main>

    <footer>

        <p>
            |
            <a target="_blank" href="https://www.instagram.com/">
                Instagram
            </a>

                Sobre Nosotros

            |
        </p>

        <span>
            © 2026 Todo en Blanco - Todos los derechos reservados
        </span>

    </footer>

    <a href="#top" class="boton-subir">
        <img src="../assets/img/volverArriba.png" alt="Volver arriba">
    </a>

    <script src="../assets/js/operacionesAdministrador.js"></script>
    <script src="../assets/js/altaEmpleados.js"></script>

</body>

</html>
