<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/pagFormulario.css">
</head>

<body>


 
<nav class="navbar">
    <section class="nav-container">

      <span class="nav-logo">
        <a href="index.html">Todo en Blanco</a>
      </span>

      <ul class="nav-menu">
       
        <li><a href="pagTrabajo.html">Trabaja con nosotros</a></li>
        <li><a href="pagEmpresa.html">Sobre nosotros</a></li>
        <li><a href="pagInicioSesion.html">Iniciar sesión</a></li>
      </ul>

    </section>
  </nav>
  



  <header>
    <h1>Consultas</h1>
  </header>



<article>
  <a href="pagContactanos.html" class="btn">Cancelar</a>
</article>


  <main>
    <span>Bienvenido a la pagina del formulario de consultas.</span>

    <form action="pagConfirmacion.html">
      <label for="nombre">Nombre: </label>
      <input type="text" id="nombre" name="nombre" required placeholder="Ej: Juan" pattern="[A-Za-zÁÉÍÓÚáéíóúñÑ ]+"
        maxlength="30">


      <label for="apellido">Apellido:</label>
      <input type="text" id="apellido" name="apellido" placeholder="Ej: Alvarez">

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="Ej: Maria@gmail.com" maxlength="50" autocomplete="email"
        pattern=".*\.com$" required>

      <label for="telefono"> Numero telefonico:</label>
      <input type="tel" id="telefono" name="telefono" placeholder="Ej: 099123456" pattern="09[0-9]{7}" maxlength="9"
        inputmode="numeric">

      <label for="categoria">Categoria:</label>
      <select id="categoria" name="categoria" required>
        <option value="">Seleccione una opción</option>
        <option value="catalogo">Catálogo</option>
        <option value="respuesta">Respuesta</option>
        <option value="desperfectos">Desperfectos</option>
      </select>

      <label for="descripcion">Descripción:</label> <textarea id="descripcion" name="descripcion" required
        placeholder="Describe tu problema..." rows="5" maxlength="300"></textarea>


      <button type="submit" class="btn">Enviar consulta</button>

    </form>
  </main>
  <footer>

    <p> | <a target="_blank" href="https://www.instagram.com/">Instagram</a> | <a href="pagEmpresa.html">Sobre
        Nosotros</a> | </p>
    <!-- El <p> es para poder añadir texto (o adornos) a los laterales de los hipervinculos, por si alguien quiere añadir algo más, como por ejemplo, información de contacto. ;) -->
    <span>© 2026 Todo en Blanco - Todos los derechos reservados</span>
  </footer>

</body>

</html>
