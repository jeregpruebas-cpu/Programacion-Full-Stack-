<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
  
     <link rel="stylesheet" href="../css/pagFormulario.css">
</head>
<body>
        <a href="pagContactanos.html"><button>Cancelar</button></a>
    <br>
        <h1>Consultas</h1>
        <hr color="black">
    <br>
 <span>Bienvenido a la pagina del formulario de consultas.</span>
 <br>
<form action="pagConfirmacion.html">
<label for="nombre">Nombre: </label>
<input type="text" id="nombre" name="nombre" required  placeholder="Ej: Juan" pattern="[A-Za-zÁÉÍÓÚáéíóúñÑ ]+" maxlength="30">


<label for="apellido">Apellido:</label>
<input type="text" id="apellido" name="apellido"  placeholder="Ej: Alvarez">

<label for="email">Email:</label>
<input type="email" id="email" name="email"  placeholder="Ej: Maria@gmail.com" maxlength="50" autocomplete="email" pattern=".*\.com$" required>

 <label for="telefono"> Numero telefonico:</label>
<input type="tel" id="telefono" name="telefono"  placeholder="Ej: 099123456" pattern="09[0-9]{7}" maxlength="9" inputmode="numeric">

<label for="categoria">Categoria:</label>
 <select id="categoria" name="categoria" required>
     <option value="">Seleccione una opción</option>
    <option value="catalogo">Catálogo</option>
    <option value="respuesta">Respuesta</option>
    <option value="desperfectos">Desperfectos</option>
      </select>

      <label for="descripcion">Descripción:</label>  <textarea 
    id="descripcion" 
    name="descripcion" 
    required 
    placeholder="Describe tu problema..."
    rows="5"
    maxlength="300"
  ></textarea>
  <br>
 
  <button type="submit">Enviar consulta</button>

</form>

  <footer>
    <br>
    <p> | <a target="_blank" href="https://www.instagram.com/">Instagram</a> | <a href="pagEmpresa.html">Sobre
        Nosotros</a> | </p>
    <!-- El <p> es para poder añadir texto (o adornos) a los laterales de los hipervinculos, por si alguien quiere añadir algo más, como por ejemplo, información de contacto. ;) -->
    <span>© 2026 Todo en Blanco - Todos los derechos reservados</span>
  </footer>

</body>
</html>
