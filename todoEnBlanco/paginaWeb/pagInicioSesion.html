<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso al sistema</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/pagInicioSesion.css">
</head>

<body>

  <nav class="navbar">
    <section class="nav-container">

      <span class="nav-logo">
        <a href="index.html">Todo en Blanco</a>
      </span>

      <ul class="nav-menu">
        <li><a href="pagContactanos.html">Contactanos</a></li>
        <li><a href="pagTrabajo.html">Trabaja con nosotros</a></li>
        <li><a href="pagEmpresa.html">Sobre nosotros</a></li>

      </ul>

    </section>
  </nav>


  <header class="centro-pagina letra-adaptable">


    <h1>Iniciar sesión</h1>

  </header>



  <main class="centro-pagina letra-adaptable">
    <section">

      <form action="pagAdmin.html">

        <article class="campo">
          <label for="cedula">Cédula</label>
          <input class="campo letra-adaptable" type="text" id="cedula" name="cedula" pattern="[1-9]{1}[0-9]{6}" required>
        </article>

        <article class="campo">
          <label for="password">Contraseña</label>
          <input class="campo letra-adaptable" type="password" id="password" name="password" required>
        </article>

        <button type="submit" class="btn">Ingresar</button>


      </form>

      </section>
  </main>

  <footer>

    <p> | <a target="_blank" href="https://www.instagram.com/">Instagram</a> | <a href="pagEmpresa.html">Sobre
        Nosotros</a> | </p>
    <!-- El <p> es para poder añadir texto (o adornos) a los laterales de los hipervinculos, por si alguien quiere añadir algo más, como por ejemplo, información de contacto. ;) -->
    <span>© 2026 Todo en Blanco - Todos los derechos reservados</span>
  </footer>
</body>

</html>
