<html>
<head>
  <title>Ingreso al sistema</title>
   <link rel="stylesheet" href="../css/global.css">
</head>
<body>
 <h2>Ingreso al sistema</h2>

<form onsubmit="redirigir(event)">
  
  <label for="cedula">Cédula:</label><br>
  <input 
  type="text" 
  id="cedula" 
  name="cedula" 
  inputmode="numeric"
  pattern="[1-9]{1}[0-9]{6}" 
  placeholder="Solo números (7 cifras)" 
  required>
  
  <br><br>

  <label for="password">Contraseña:</label><br>
  <input 
    type="password" 
    id="password" 
    name="password" 
    maxlength="12" 
    required>

  <button type="button" class="btn" onclick="togglePassword()">Mostrar/Ocultar</button>

  <br><br>

<button type="submit" class="btn">Ingresar</button>
</form>

<script>
function togglePassword() {
  const input = document.getElementById("password");

  if (input.type === "password") {
    input.type = "text";
  } else {
    input.type = "password";
  }
}

function redirigir(e) {
  e.preventDefault(); // evita que recargue
  window.location.href = "pagAdmin.html"; // redirige
}
</script>

</body>
